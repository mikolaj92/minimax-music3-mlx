[project]
name = "minimax-music3-mlx"
version = "0.1.0"
description = "MiniMax Music 3 inference on Apple Silicon via MLX"
requires-python = ">=3.10"
dependencies = [
  "mlx>=0.22",
  "mlx-lm>=0.22",
  "numpy",
  "soundfile",
  "huggingface_hub",
  "safetensors",
  "transformers",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
minimax-music3 = "minimax_music3_mlx.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax_music3_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
